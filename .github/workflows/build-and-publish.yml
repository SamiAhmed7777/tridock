name: Build and Publish Docker Image

on:
  push:
    branches: [master]
    # Skip if only markdown/non-build files changed
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'healthcheck.sh'
      - 'tridock.sh'
      - 'package*.json'
      - 'server.mjs'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - '.github/workflows/build-and-publish.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: samiahmed7777/tridock

jobs:
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: meta
        run: |
          # On push to master, tag with short SHA + latest
          # On workflow_dispatch, use the user-provided tag (or latest)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            USER_TAG="${{ inputs.tag }}"
            TAGS="samiahmed7777/tridock:${USER_TAG}"
            # If user tagged as 'latest', also tag with SHA for traceability
            if [ "$USER_TAG" = "latest" ]; then
              TAGS="${TAGS},samiahmed7777/tridock:git-${GITHUB_SHA::7}"
            fi
          else
            TAGS="samiahmed7777/tridock:latest,samiahmed7777/tridock:git-${GITHUB_SHA::7}"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/SamiAhmed7777/tridock
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=registry,ref=samiahmed7777/tridock:buildcache
          cache-to: type=registry,ref=samiahmed7777/tridock:buildcache,mode=max

# ============================================================================
# TRIdock — TRI7 era (docker-compose.yml)
# tri7d (modern Rust client) node + bundled tor. The legacy C++-client image
# remains available: samiahmed7777/tridock:legacy (see docker-compose.legacy.yml).
#
# Build (from the tridock repo, with a tri7 checkout next to it):
#   docker build -f tri7.Dockerfile \
#     --build-context tri7=../tri7 \
#     -t samiahmed7777/tridock:tri7 .
# ============================================================================
services:
  tridock:
    build:
      context: .
      dockerfile: tri7.Dockerfile
      additional_contexts:
        tri7: ../tri7
    image: samiahmed7777/tridock:tri7
    container_name: tridock-tri7
    restart: unless-stopped
    ports:
      - "24113:24113/tcp"   # inbound P2P
      - "24113:24113/udp"
      - "19112:19112/tcp"   # JSON-RPC (loopback-only inside tri7d; socat bridge)
    environment:
      # full  → follower with full store (default)
      # seed  → follow + serve (relay)
      # staking → stake=1; REQUIRES the wallet mounted at /var/lib/tri7/wallet
      TRI_MODE: "full"

      TRI_RPCUSER: "tri"
      TRI_RPCPASSWORD: ""            # empty = generated randomly at first start
                                     # (stored in /var/lib/tri7/conf/triangles.conf).
                                     # Known-default passwords are REFUSED.
      TRI_RPCPORT: "19112"
      TRI_P2PPORT: "24113"

      TRI_TOR_ENABLED: "1"           # bundled tor; SOCKS 127.0.0.1:9050
      TRI_TOR_SOCKS: "127.0.0.1:9050"

      # Outbound peers. Clearnet (direct) and onion (via tor SOCKS) are separate
      # lists. Empty = tri7d's built-in seed rotation.
      TRI_PEERS: ""
      TRI_ONION_PEERS: "i6tk7soznftvoibtskwlezviskiererhjndpsmrff4kaxw7jnd5izfqd.onion:24112"

      # Bootstrap: unset = fresh sync via P2P gap-fill (recommended). The
      # legacy bootstrap.cryptographic-triangles.org tarball is dead. The
      # tri7-era blk0001.dat archive lives on DNS2 (/root/.triangles/blk0001.dat);
      # if you serve it over HTTP, point TRI_BOOTSTRAP_URL (+ SHA256) here.
      TRI_BOOTSTRAP_URL: ""
      TRI_BOOTSTRAP_SHA256: ""

      TRI_STATIC: "0"                # 1 = air-gapped/static (skips health gate)

      # Extra tri7d CLI args appended verbatim (optional)
      # TRI_EXTRA_ARGS: ""
    volumes:
      - tri7_state:/var/lib/tri7
      # Staking mode — uncomment and point at your wallet dir:
      # - ./wallet:/var/lib/tri7/wallet:ro

volumes:
  tri7_state:

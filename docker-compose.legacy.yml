# LEGACY ROLLBACK compose — the pre-TRI7 C++ client appliance (trianglesd +
# web wallet UI). Kept for rollback only; see README "Rollback" section.
services:
  tridock:
    image: samiahmed7777/tridock:legacy
    container_name: tridock-legacy
    restart: unless-stopped
    working_dir: /tri
    ports:
      - "24116:24112/tcp"
      - "24116:24112/udp"
      - "19116:19112/tcp"
      - "4177:4177/tcp"
    environment:
      TRI_NODE_TYPE: "full"
      TRI_MODE: "full"
      TRI_VERSION: "5.9.14"
      TRI_TOR_ENABLED: "1"
      TRI_RPCUSER: "tri"
      TRI_RPCPASSWORD: "change-me"
      TRI_RPCPORT: "19112"
      TRI_PORT: "24112"
    volumes:
      - tri_data:/tri/data

volumes:
  tri_data:
